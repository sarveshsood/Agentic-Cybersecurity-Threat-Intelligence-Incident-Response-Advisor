<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#0B1220"/>
  <text x="40" y="44" fill="#E8EEF7" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">ACTIRA — Data flow (upload → review)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E8EEF7">
    <rect x="30" y="100" width="130" height="70" rx="10" fill="#1E3A5F"/>
    <text x="55" y="140">1. Upload</text>
    <rect x="190" y="100" width="130" height="70" rx="10" fill="#1E3A5F"/>
    <text x="220" y="140">2. Job</text>
    <rect x="350" y="100" width="130" height="70" rx="10" fill="#1E3A5F"/>
    <text x="375" y="140">3. Parse</text>
    <rect x="510" y="100" width="130" height="70" rx="10" fill="#1E3A5F"/>
    <text x="540" y="140">4. IoC</text>
    <rect x="670" y="100" width="130" height="70" rx="10" fill="#164E63"/>
    <text x="700" y="140">5. TI</text>
    <rect x="830" y="100" width="140" height="70" rx="10" fill="#164E63"/>
    <text x="855" y="140">6. ATT&amp;CK</text>
    <rect x="1000" y="100" width="160" height="70" rx="10" fill="#14532D"/>
    <text x="1030" y="140">7. RAG PB</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E8EEF7">
    <rect x="190" y="240" width="200" height="70" rx="10" fill="#713F12"/>
    <text x="230" y="280">8. HiTL gate</text>
    <rect x="440" y="240" width="220" height="70" rx="10" fill="#1E3A5F"/>
    <text x="475" y="280">9. Workspace</text>
    <rect x="710" y="240" width="220" height="70" rx="10" fill="#14532D"/>
    <text x="740" y="280">10. Audit / Export</text>
  </g>
  <text x="40" y="370" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Critical severity or low grounding → pending_review. Citations must subset KB allow-list.</text>
</svg>
