<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#F8FAFC"/>
  <text x="40" y="44" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">ACTIRA — Data flow (upload to review)</text>
  <text x="40" y="72" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="14">Job-queued IR pipeline · modular stages · HiTL gate before high-risk closure</text>

  <!-- Stage row 1 -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0F172A">
    <rect x="30" y="110" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="62" y="142" fill="#2563EB" font-weight="700" font-size="12">1. UPLOAD</text>
    <text x="48" y="168">Logs / ZIP / API</text>

    <rect x="195" y="110" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="232" y="142" fill="#2563EB" font-weight="700" font-size="12">2. JOB</text>
    <text x="218" y="168">Queue + worker</text>

    <rect x="360" y="110" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="395" y="142" fill="#2563EB" font-weight="700" font-size="12">3. PARSE</text>
    <text x="378" y="168">Multi-format CES</text>

    <rect x="525" y="110" width="140" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="565" y="142" fill="#2563EB" font-weight="700" font-size="12">4. IoC</text>
    <text x="548" y="168">Extract + filter</text>

    <rect x="690" y="110" width="140" height="78" rx="12" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="735" y="142" fill="#1D4ED8" font-weight="700" font-size="12">5. TI</text>
    <text x="712" y="168">Enrich (or mock)</text>

    <rect x="855" y="110" width="140" height="78" rx="12" fill="#DBEAFE" stroke="#93C5FD"/>
    <text x="885" y="142" fill="#1D4ED8" font-weight="700" font-size="12">6. ATT&amp;CK</text>
    <text x="872" y="168">Technique map</text>

    <rect x="1020" y="110" width="150" height="78" rx="12" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="1045" y="142" fill="#047857" font-weight="700" font-size="12">7. HYBRID RAG</text>
    <text x="1040" y="168">Playbook + cites</text>
  </g>

  <!-- arrows row 1 -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M170 149 H195"/>
    <path d="M335 149 H360"/>
    <path d="M500 149 H525"/>
    <path d="M665 149 H690"/>
    <path d="M830 149 H855"/>
    <path d="M995 149 H1020"/>
  </g>

  <!-- Stage row 2 -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0F172A">
    <rect x="195" y="260" width="200" height="78" rx="12" fill="#FEF3C7" stroke="#FCD34D"/>
    <text x="245" y="292" fill="#B45309" font-weight="700" font-size="12">8. HiTL GATE</text>
    <text x="220" y="318">Critical / low ground</text>

    <rect x="440" y="260" width="220" height="78" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="490" y="292" fill="#2563EB" font-weight="700" font-size="12">9. WORKSPACE</text>
    <text x="465" y="318">Case system of record</text>

    <rect x="710" y="260" width="240" height="78" rx="12" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="755" y="292" fill="#047857" font-weight="700" font-size="12">10. AUDIT / EXPORT</text>
    <text x="735" y="318">Hash chain + exec pack</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M1095 188 V230 H295 V260"/>
    <path d="M395 299 H440"/>
    <path d="M660 299 H710"/>
  </g>

  <rect x="40" y="380" width="1120" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="415" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">EVALUATOR NOTES</text>
  <text x="60" y="442" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Stages are deterministic offline: template playbooks + mock TI when LLM/TI keys are absent.</text>
  <text x="60" y="466" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">• HiTL: critical severity or low grounding_score forces pending_review (race-safe approve/reject).</text>
</svg>
