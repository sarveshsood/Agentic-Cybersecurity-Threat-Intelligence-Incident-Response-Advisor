[pytest]
# Root ACTIRA quality-gate config.
# Discovers: backend/tests (existing suite) + tests/ (framework suites).
# Backend-only xdist default remains in backend/pytest.ini when running
#   cd backend && pytest
# Prefer `make test` / `make ci` from repo root.

minversion = 8.0
testpaths =
    backend/tests
    tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Repo root on path so absolute imports `from backend.X` resolve (P0).
pythonpath = .

# Async support for FastAPI / motor tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeouts (pytest-timeout); override with --timeout=0 to disable
timeout = 120
timeout_method = thread

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:lancedb.*
    ignore::UserWarning:pyarrow.*

log_cli = false
log_cli_level = INFO
log_level = INFO

# Markers — use: pytest -m "unit and not slow"
markers =
    unit: pure offline unit tests (no network, no Mongo required)
    integration: needs Mongo or external process (skip without ACTIRA_INTEGRATION=1)
    api: HTTP API contract tests (TestClient / httpx)
    e2e: full stack / Playwright bridge (skip without ACTIRA_E2E=1)
    security: security / abuse-case tests
    performance: smoke/load micro-benchmarks (not default CI unit)
    regression: locks previously fixed bugs
    golden: offline golden IR benchmark
    slow: long-running tests
    requires_mongo: needs reachable MONGO_URL
    requires_llm: needs live LLM keys (never default CI)

# Strict markers so typos fail; parallel via Makefile (-n). Keep root addopts free of -n
# so `pytest -n 0` works without colliding with backend/pytest.ini when cwd is backend.
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

# JUnit / HTML paths relative to cwd (Makefile sets reports/)
# Use CLI: --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
