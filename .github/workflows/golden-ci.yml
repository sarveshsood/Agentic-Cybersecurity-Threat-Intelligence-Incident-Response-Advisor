# Offline golden IR benchmark — no Mongo, no LLM keys required.
name: Golden IR benchmark

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/golden-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/golden-ci.yml"
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Golden benchmark (pytest)
        run: pytest tests/test_golden_benchmark.py -v -n 0 --tb=short

      - name: Golden CLI summary
        run: python -m golden_eval
