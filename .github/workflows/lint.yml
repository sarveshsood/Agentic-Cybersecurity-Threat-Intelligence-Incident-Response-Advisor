name: Lint

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff black isort flake8 mypy
      - name: Ruff
        run: ruff check backend tests || true
      - name: Black
        run: black --check backend tests || true
      - name: isort
        run: isort --check-only --profile black backend tests || true
      - name: Flake8 critical
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Mypy (core modules)
        working-directory: backend
        run: mypy --ignore-missing-imports hitl_gate.py models.py secrets_util.py || true
