# ACTIRA full quality gate — unit, lint, openapi, frontend build
name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit + framework
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -r ../requirements-test.txt
      - name: Unit tests (serial, offline)
        env:
          ENV: test
          FORCE_MOCK_TI: "true"
          JWT_SECRET: ci-jwt-secret-not-for-production-use-32b
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: soc_console_ci
        run: |
          mkdir -p ../reports
          pytest tests -n 0 \
            -m "not integration and not e2e and not performance and not requires_llm" \
            --junitxml=../reports/junit-unit.xml \
            --html=../reports/pytest-unit.html --self-contained-html \
            -v --tb=short
      - name: Framework suites (root)
        working-directory: .
        env:
          ENV: test
          FORCE_MOCK_TI: "true"
          JWT_SECRET: ci-jwt-secret-not-for-production-use-32b
        run: |
          pytest -c pytest.ini tests -n 0 \
            -m "not integration and not e2e and not performance and not requires_mongo and not requires_llm" \
            --junitxml=reports/junit-framework.xml -v --tb=short
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: reports/
          if-no-files-found: ignore

  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: |
          pip install -U pip
          pip install ruff black isort flake8
      - name: Ruff
        run: ruff check . || true
      - name: Black check
        run: black --check --diff . || true
      - name: Critical flake8 (syntax/undefined)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          pip install -U pip
          pip install -r requirements.txt
      - name: Export + check drift
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: soc_console_openapi_ci
          JWT_SECRET: openapi-ci-not-for-production-use-32chars
        run: python scripts/export_openapi.py --check -o ../docs/openapi.json

  golden:
    name: Golden IR offline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          pip install -U pip
          pip install -r requirements.txt
      - run: pytest tests/test_golden_benchmark.py -n 0 -v --tb=short

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npm run build
        env:
          CI: true
          REACT_APP_BACKEND_URL: http://localhost:8001
          DISABLE_ESLINT_PLUGIN: "true"


  coverage:
    name: Coverage report (informational)
    runs-on: ubuntu-latest
    needs: [ backend-unit ]
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt
      - run: |
          pip install -U pip
          pip install -r requirements.txt -r ../requirements-test.txt
      - name: Coverage (fail_under soft — set COV_STRICT=1 for hard gate)
        env:
          ENV: test
          FORCE_MOCK_TI: "true"
          JWT_SECRET: ci-jwt-secret-not-for-production-use-32b
          COV_STRICT: ${{ vars.COV_STRICT || '0' }}
        run: |
          mkdir -p ../reports/coverage_html
          FAIL=0
          if [ "$COV_STRICT" = "1" ]; then FAIL=95; fi
          pytest tests -n 0 \
            -m "not integration and not e2e and not performance and not requires_llm" \
            --cov=. --cov-config=../.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:../reports/coverage.xml \
            --cov-report=html:../reports/coverage_html \
            --cov-fail-under=$FAIL -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: reports/coverage_html/
          if-no-files-found: ignore
