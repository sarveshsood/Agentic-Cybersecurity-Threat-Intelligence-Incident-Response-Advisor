# Contract snapshot: FastAPI OpenAPI must match docs/openapi.json
name: OpenAPI contract

on:
  push:
    paths:
      - "backend/**"
      - "docs/openapi.json"
      - "docs/SPEC_WORKFLOW.md"
      - ".github/workflows/openapi-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.json"
      - "docs/SPEC_WORKFLOW.md"
      - ".github/workflows/openapi-ci.yml"
  workflow_dispatch:

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export + check OpenAPI drift
        env:
          # Import-only; no live Mongo required for app.openapi()
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: soc_console_openapi_ci
          JWT_SECRET: openapi-ci-not-for-production-use-32chars
        run: python scripts/export_openapi.py --check -o ../docs/openapi.json

      - name: Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("../docs/openapi.json")
          s = json.loads(p.read_text(encoding="utf-8"))
          print(f"title={s.get('info',{}).get('title')} paths={len(s.get('paths') or {})}")
          PY
