# Playwright e2e — optional; requires services. Manual or nightly.
name: E2E Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      SEED_DEMO_USERS: "true"
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: soc_console_e2e
      JWT_SECRET: e2e-jwt-secret-not-for-production-use-32b
      FORCE_MOCK_TI: "true"
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          pip install -U pip
          pip install -r backend/requirements.txt
      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8001/api/health && break
            sleep 2
          done
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000 && break
            sleep 3
          done
      - name: Playwright smoke
        working-directory: frontend
        run: npx playwright test --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
