# ACTIRA pre-commit — install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ "--maxkb=1024" ]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [ "--fix=lf" ]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        files: ^(backend|tests)/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [ "--profile", "black" ]
        files: ^(backend|tests)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [ "--fix" ]
        files: ^(backend|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [ ]
        args: [ "--ignore-missing-imports", "--config-file=mypy.ini" ]
        files: ^backend/(hitl_gate|models|secrets_util|auth|mongo_util)\.py$
        pass_filenames: true

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ "--baseline", ".secrets.baseline" ]
        exclude: (package-lock\.json|yarn\.lock|docs/openapi\.json|memory/)
