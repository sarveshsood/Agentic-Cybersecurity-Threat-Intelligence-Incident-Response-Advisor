# Copy to secret.yaml (DO NOT commit real values). Prefer External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: actira-secrets
  namespace: actira
type: Opaque
stringData:
  JWT_SECRET: "replace-with-long-random"
  SECRETS_MASTER_KEY: "replace-with-fernet-or-passphrase"
  MONGO_URL: "mongodb://user:pass@mongo:27017/?authSource=admin"
  ANTHROPIC_API_KEY: ""
  INGEST_API_KEY: "replace"
