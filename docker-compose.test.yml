# ACTIRA test stack — offline-friendly quality gate with Mongo
# Usage:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner
# Or: make docker-test

services:
  mongodb:
    image: mongo:7
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: soc_console_test
      ENV: test
      FORCE_MOCK_TI: "true"
      JWT_SECRET: docker-test-jwt-secret-not-for-prod-32b
      SEED_DEMO_USERS: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  test-runner:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: soc_console_test
      ENV: test
      FORCE_MOCK_TI: "true"
      JWT_SECRET: docker-test-jwt-secret-not-for-prod-32b
      ACTIRA_INTEGRATION: "1"
      PYTHONPATH: /app
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: >
      bash -c "pip install -q -r backend/requirements.txt -r requirements-test.txt
      && mkdir -p reports
      && pytest -c pytest.ini backend/tests tests
      -n 0
      -m 'not e2e and not performance and not requires_llm'
      --junitxml=reports/junit-docker.xml
      -v --tb=short"
