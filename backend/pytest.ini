[pytest]
# Backend-local defaults when running: cd backend && pytest
# Fixed 2 xdist workers (deterministic). loadscope pins each test module to one worker.
# Serial = `pytest -n 0` (override addopts -n).
# Prefer repo-root `make test` for full quality-gate reports + markers.

required_plugins = pytest-xdist
testpaths = tests
python_files = test_*.py *_test.py
# Parent of backend/ (repo root) so `from backend.X` works when cwd is backend/
pythonpath = ..
asyncio_mode = auto
timeout = 120

markers =
    unit: pure offline unit tests
    integration: needs Mongo or services
    api: HTTP API tests
    e2e: end-to-end
    security: security tests
    performance: performance micro-benchmarks
    regression: regression locks
    golden: offline golden IR
    slow: long-running
    requires_mongo: needs MONGO_URL
    requires_llm: needs live LLM keys

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

addopts = -n 2 --dist loadscope -ra --strict-markers --tb=short
